      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#101113"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- schematic motif -->
  <g fill="none" stroke="#33373d" stroke-width="2">
    <path d="M860 170 H950 V265"/>
    <path d="M1040 170 H950"/>
    <path d="M860 430 H950 V321"/>
    <path d="M1040 430 H950"/>
  </g>
  <g fill="#101113" stroke="#3a3e44" stroke-width="2">
    <rect x="846" y="156" width="28" height="28"/>
    <rect x="1026" y="156" width="28" height="28"/>
    <rect x="846" y="416" width="28" height="28"/>
    <rect x="1026" y="416" width="28" height="28"/>
  </g>
  <g fill="#f0723f">
    <rect x="855" y="165" width="10" height="10"/>
    <rect x="1035" y="165" width="10" height="10"/>
    <rect x="855" y="425" width="10" height="10"/>
    <rect x="1035" y="425" width="10" height="10"/>
