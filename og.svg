  <!-- text -->
  <text x="88" y="150" font-family="Menlo, Consolas, monospace" font-size="20" letter-spacing="4" fill="#f0723f">INGENIERÍA DE SOFTWARE · INTEGRACIÓN · IA</text>

  <text x="86" y="268" font-family="Georgia, 'Times New Roman', serif" font-size="74" fill="#f2f2ef">Ingeniería de software</text>
  <text x="86" y="342" font-family="Georgia, 'Times New Roman', serif" font-size="74" fill="#f2f2ef">para construir sistemas</text>
  <text x="86" y="416" font-family="Georgia, 'Times New Roman', serif" font-size="74" fill="#f2f2ef">que evolucionan.</text>

  <text x="88" y="482" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#a4a7ab">Diseñamos, construimos, integramos y hacemos evolucionar</text>
  <text x="88" y="514" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#a4a7ab">sistemas efectivos, mantenibles y preparados para el cambio.</text>

  <text x="86" y="584" font-family="Georgia, 'Times New Roman', serif" font-size="36" fill="#f2f2ef">integrala<tspan fill="#f0723f">.</tspan></text>
  <text x="1140" y="582" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="16" letter-spacing="1" fill="#6e7276">palumbon.github.io/integrala-landing</text>
